<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'catalogo/css/styles.css' %}">
    <title>Confirmar Exclusão</title>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Confirmar Exclusão</h1>
        <p>Tem certeza de que deseja excluir o recurso "<strong>{{ recurso.nome }}</strong>"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Sim, excluir</button>
        </form>
        <br>
        <a href="{% url 'detalhe' recurso.id %}">← Cancelar</a>
    </div>
</div>
</body>
</html>
